<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Trainer portal | LiftMetrics</title><link rel="stylesheet" href="index.css"><link rel="stylesheet" href="profile.css"><script src="https://cdn.auth0.com/js/auth0-spa-js/1.13/auth0-spa-js.production.js"></script><script src="trainer.js" type="module"></script></head>
<body><main class="plan-page trainer-page"><a class="back-link" href="profile.html">← Back to profile</a><p class="plan-eyebrow">TRAINER PORTAL</p><h1>Your clients</h1><p id="trainer-status" role="status">Loading your portal…</p>
<section id="trainer-tools" class="profile-card" hidden><h2>Invite a client</h2><p>Share this one-time link with your client. It expires after 7 days.</p><div class="profile-actions"><button id="create-invite-btn" type="button">Create invite link</button><input id="invite-link" aria-label="Invite link" readonly hidden></div></section>
<section id="client-list" class="trainer-client-list"></section>
<section id="client-detail" class="profile-card" hidden><button id="close-client-btn" class="quiet-button" type="button">← All clients</button><h2 id="client-name"></h2><p id="client-summary"></p><div id="client-workouts" class="trainer-workouts"></div><h3>Coach notes</h3><div id="client-notes"></div><form id="note-form" class="import-form"><label for="note-body">New note<textarea id="note-body" maxlength="2000" required></textarea></label><button type="submit">Save note</button></form><h3>Assign a plan</h3><form id="assign-plan-form" class="import-form"><label>Plan name<input id="assigned-title" maxlength="120" required></label><label>Plan details <small>Day | Session | Exercise | Sets/reps | Rest</small><textarea id="assigned-text" rows="6" required></textarea></label><button type="submit">Assign plan</button></form></section>
</main></body></html>
