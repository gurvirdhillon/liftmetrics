<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>LiftMetrics</title>
    <link rel="stylesheet" href="index.css">
    <script src="https://cdn.auth0.com/js/auth0-spa-js/1.13/auth0-spa-js.production.js" defer></script>
    <script src="index.js" type="module"></script>
    <script src="quotes.js" type="module"></script>
    <script src="insights-link.js" defer></script>
    <link rel="icon" type="image/png" sizes="180x180" href="img/favicon.png?v=2">
    <link rel="apple-touch-icon" sizes="180x180" href="https://liftmetrics.s3.us-east-1.amazonaws.com/favicon.png">
</head>
<body>
    <div class="hero">
        <h1 class="page-title">LiftMetrics</h1>
        <p class="tagline">Track your Performance. Build Strength.</p>
        <section id="login-prompt" class="login-prompt" aria-live="polite" hidden>
            <button id="login" type="button">Log in</button>
        </section>
        <section id="home-dashboard" class="home-dashboard" aria-live="polite" hidden>
            <p id="home-greeting" class="home-greeting"></p>
            <article class="next-session-card">
                <p class="dashboard-eyebrow">YOUR NEXT SESSION</p>
                <h2 id="next-session-title">Getting your session ready…</h2>
                <p id="next-session-detail"></p>
                <a class="home-primary-action" href="lift.html">Start workout <span aria-hidden="true">→</span></a>
            </article>
            <article id="dashboard-wellness" class="dashboard-wellness-card">
                <div><p class="dashboard-eyebrow">TODAY'S WELLNESS</p><h2 id="dashboard-readiness">Complete your check-in</h2><p id="dashboard-wellness-detail">Log sleep and recovery in under a minute.</p></div>
                <a class="wellness-dashboard-action" href="wellness.html">Check in <span aria-hidden="true">→</span></a>
            </article>
            <div class="home-summary-grid">
                <article class="home-summary-card"><span id="weekly-workout-count">—</span><p>sessions this week</p></article>
                <article class="home-summary-card"><span id="latest-workout-label">—</span><p>last workout</p></article>
            </div>
            <div class="home-quick-links" aria-label="Quick links"><a href="plan.html">View plan</a><a href="history.html">Workout history</a><a href="msg.html">Community chat</a></div>
        </section>
        <!-- <button id="log_btn">Log your Lift</button> -->
        <span id="thequote"></span>
    </div>

    <nav class="navbar">
        <a href="index.html"><img src="img/home_icon.png" class="icon_img"></a>
        <a data-auth-required href="lift.html"><img src="img/plus_icon.png" class="icon_img" alt="Log workout"></a>
        <a data-auth-required data-insights-link href="http://localhost:8501" target="_blank" rel="noopener"><img src="img/workout_insights.jpg" class="icon_img" alt="LiftMetrics insights"></a>
        <a data-auth-required href="wellness.html" class="wellness-nav-link" aria-label="Wellness">♥</a>
        <a data-auth-required href="profile.html"><img src="img/profile_icon.jpg" class="icon_img" alt="Profile"></a>
    </nav>
</body>
