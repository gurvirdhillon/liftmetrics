<!DOCTYPE html>
<html lang="en">
<head>
    <title>Log your lift</title>
    <link rel="stylesheet" href="index.css">
    <link rel="icon" type="image/png" href="img/logo.png">
    <script src="https://cdn.auth0.com/js/auth0-spa-js/1.13/auth0-spa-js.production.js" defer></script>
    <script src="insights-link.js" defer></script>
</head>
<body>
    <h1 class="page-title">LiftMetrics</h1>
    <p class="tagline">Record your workout session.</p>

    <!-- <a class="history-link" href="history.html">Workout History</a> -->
    <div class="form_container">
    <form id="workoutForm">
        <div class="form_rec">
            <div class="section_title">
                <img src="img/dumbbell_icon.png" class="icon_img">
                <p>Exercise Information</p>
            </div>
            <label>Date:</label>
            <input type="date" id="DateInput" required>
            <label>Session Duration: </label>
        <div class="duration_input">
            <input type="number" name="session_duration_hr" min="0" required>
            <select name="duration_metric">
                <option>mins</option>
                <option>hours</option>
            </select>
        </div>
            <div class="exercise_row">
                <div class="input_group">
                    <label>Exercise</label>
                    <select name="exercise" required>
                        <option value="">Select Exercise</option>
                        <option>Bench Press</option>
                        <option>Squat</option>
                        <option>Deadlift</option>
                        <option>Overhead Press</option>
                        <option>Barbell Row</option>
                        <option>Pull Ups</option>
                        <option>Lat Pulldown</option>
                        <option>Bicep Curl</option> 
                        <option>Tricep Extension</option> 
                        <option>Leg Press</option> 
                        <option>Leg Curl</option> 
                        <option>Leg Extension</option> 
                        <option>Calf Raise</option>
                        <option>Other</option>
                    </select>
                </div>
                <div class="input_group">
                    <label>Workout Type</label>
                    <select name="workout_type">
                        <option>Strength</option>
                        <option>Cardio</option>
                        <option>HIIT</option>
                        <option>Mobility</option>
                        <option>Sports</option>
                        <option>Recovery</option>
                    </select>
                </div>
            </div>
            <p></p>
            <label>How did you feel?</label>
            <p></p>
            <div style="display:flex; justify-content:space-between;"> 
                <span>0<br>Super easy</span> 
                <span>5<br>Moderate</span> 
                <span>10<br>Super hard</span> 
            </div> <input id="feelingRange" type="range" min="0" max="10" value="5" step="1">
        </div>
        <section class="form_rec performance-strength" aria-labelledby="strength-performance-title">
            <div class="section_title">
                <img src="img/dumbbell_icon.png" class="icon_img" alt="">
                <p id="strength-performance-title">Strength performance</p>
            </div>
            <p class="form-hint">Add every movement you performed. Your last saved workout can be used as a starting point.</p>
            <div id="exercise-entries" class="exercise-entries"></div>
            <div class="entry-actions"><button type="button" id="add-exercise">Add exercise</button><button type="button" id="repeat-workout" class="secondary-btn">Repeat last workout</button></div>
        </section>

        <section class="form_rec performance-cardio" style="display:none;" aria-labelledby="cardio-performance-title">
            <div class="section_title">
                <img src="img/dumbbell_icon.png" class="icon_img" alt="">
                <p id="cardio-performance-title">Cardio performance</p>
            </div>
            <div class="performance_row">
                <div class="input_group">
                    <label for="distance">Distance</label>
                    <input id="distance" type="number" step="0.1" name="distance" inputmode="decimal">
                </div>
                <div class="input_group">
                    <label for="distance-unit">Distance unit</label>
                    <select id="distance-unit" name="distance_unit">
                        <option>km</option>
                        <option>miles</option>
                    </select>
                </div>
                <div class="input_group">
                    <label for="calories">Calories burned</label>
                    <input id="calories" type="number" min="0" name="calories" inputmode="numeric">
                </div>
                <div class="input_group">
                    <label for="pace">Average pace (min/km)</label>
                    <input id="pace" type="number" min="0" step="0.1" name="pace" inputmode="decimal">
                </div>
            </div>
        </section>

        <div class="form_rec">
            <div class="input_group">
            <div class="section_title">
                <img src="img/physiology.jpeg" class="icon_img">
                <label>Physiology</label>
            </div>
            <p>Avg BPM:</p>
            <input type="number" min="1" name="avg_bpm">
            <p>Max BPM:</p>
            <input type="number" min="1" name="max_bpm">
            <p>Water intake(L):</p>
            <input type="number" name="water_intake">

        </div>
        <input type="submit">
    </div>
        </form>

    <nav class="navbar">
        <a href="index.html"><img src="img/home_icon.png" class="icon_img"></a>
        <a href="lift.html"><img src="img/plus_icon.png" class="icon_img"></a>
        <a data-insights-link href="http://localhost:8501" target="_blank" rel="noopener"><img src="img/workout_insights.jpg" class="icon_img"></a>
        <a href="msg.html"><img src="img/msg_icon.jpg" class="icon_img"></a>
        <a href="profile.html"><img src="img/profile_icon.jpg" class="icon_img"></a>
    </nav>

<script src="lift.js" type="module"></script>


</body>
</html>
