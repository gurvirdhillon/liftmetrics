<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>LiftMetrics</title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="msg.css">
    <link rel="icon" type="image/png" href="img/logo.png">
    <script src="https://cdn.auth0.com/js/auth0-spa-js/1.13/auth0-spa-js.production.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="msg.js" type="module"></script>
    <script src="insights-link.js" defer></script>
</head>
<body>
    <h1 class="page-title">LiftMetrics Public chat</h1>
    <p class="tagline">Join our community. Inspire growth. Inspire change.</p>

    <div class="chat">
        <div class="messages_box">
            <p class="empty-text">No messages yet.<br>Start the conversation!</p>
        </div>

        <div class="input-area">
            <form id="msgHolder">
                <input type="text" placeholder="Type a message..." id="MsgContent" />
                <button id="triggerBtn" type="submit">Send</button>
            </form>
        </div>
    </div>

    <nav class="navbar">
        <a href="index.html"><img src="img/home_icon.png" class="icon_img"></a>
        <a href="lift.html"><img src="img/plus_icon.png" class="icon_img"></a>
        <a data-insights-link href="http://localhost:8501" target="_blank" rel="noopener"><img src="img/workout_insights.jpg" class="icon_img"></a>
        <a class="wellness-nav-link" href="wellness.html" aria-label="Wellness">♥</a>
        <a href="profile.html"><img src="img/profile_icon.jpg" class="icon_img"></a>
    </nav>
</body>
