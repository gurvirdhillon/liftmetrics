services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: liftmetrics
      POSTGRES_USER: liftmetrics
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./SQL/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./SQL/migrations:/docker-entrypoint-initdb.d/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liftmetrics -d liftmetrics"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: liftmetrics
      DB_USER: liftmetrics
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: liftmetrics
      DB_USER: liftmetrics
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8501:8501"
    volumes:
      - ./.streamlit/secrets.toml:/app/.streamlit/secrets.toml:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
